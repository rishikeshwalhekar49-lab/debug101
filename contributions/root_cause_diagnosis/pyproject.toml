[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "silent-bug-agent"
version = "0.1.0"
description = "AI-powered root-cause diagnosis agent for ML/DL bugs"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = false
log_level = "WARNING"

[tool.coverage.run]
source = ["silent_bug_agent"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
